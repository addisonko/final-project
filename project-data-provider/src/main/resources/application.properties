spring.application.name=project-data-provider
server.port=${PORT:8081}

finnhub.api.base-url=finnhub.io
finnhub.api.quote-path=/api/v1/quote
finnhub.api.news-path=/api/v1/company-news
finnhub.api.token=${FINNHUB_TOKEN}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled==${REDIS_SSL:false}

live.quote.timezone=America/New_York
live.quote.window-start=00:01
live.quote.window-end=23:59
live.quote.window-start-cron=0 30 09 * * MON-FRI
