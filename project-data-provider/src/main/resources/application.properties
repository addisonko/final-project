spring.application.name=project-data-provider
server.port=${PORT:8081}

finnhub.api.base-url=finnhub.io
finnhub.api.quote-path=/api/v1/quote
finnhub.api.news-path=/api/v1/company-news
finnhub.api.token=${FINNHUB_TOKEN}
stock-data.base-url=${STOCK_DATA_BASE_URL:https://project-stock-data-production-8ee5.up.railway.app}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

live.quote.timezone=America/New_York
live.quote.market-open-cron=0 30 09 * * MON-FRI
live.quote.market-midday-cron=0 00 13 * * MON-FRI
live.quote.market-close-cron=0 00 16 * * MON-FRI
