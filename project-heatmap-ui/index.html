<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Heatmap</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div class="dashboard-title">
        <h1>Stock Heatmap</h1>
        <p class="dashboard-subtitle">Loading…</p>
      </div>
      <div class="legend legend--gradient" aria-label="Performance legend">
        <div class="legend-gradient-bar">
          <span class="legend-gradient-label">-3%</span>
          <span class="legend-gradient-label">-2%</span>
          <span class="legend-gradient-label">-1%</span>
          <span class="legend-gradient-label">0%</span>
          <span class="legend-gradient-label">+1%</span>
          <span class="legend-gradient-label">+2%</span>
          <span class="legend-gradient-label">+3%</span>
        </div>
      </div>
    </header>

    <main class="heatmap" aria-label="S&amp;P 500 sector heatmap" aria-live="polite">
      <!-- Populated dynamically by js/app.js -->
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
