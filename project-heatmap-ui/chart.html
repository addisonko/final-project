<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Chart</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="chart-page">
  <header class="chart-page__header">
    <div class="chart-page__title-block">
      <div class="chart-page__logo-wrap" id="chart-logo-wrap" hidden>
        <img class="chart-page__logo" id="chart-logo" alt="" />
      </div>
      <div class="chart-page__text">
        <h1 class="chart-page__symbol" id="chart-symbol">Loading…</h1>
        <p class="chart-page__company" id="chart-subtitle"></p>
      </div>
    </div>
    <div class="chart-page__quote" id="chart-quote" hidden>
      <span class="chart-page__price" id="chart-price"></span>
      <span class="chart-page__change" id="chart-change"></span>
    </div>
  </header>

  <main class="chart-page__main">
    <div class="chart-page__layout">
      <div class="chart-page__content">
        <div class="chart-page__range" role="tablist" aria-label="Chart range">
          <button type="button" class="chart-page__range-btn" data-range="1M">1M</button>
          <button type="button" class="chart-page__range-btn is-active" data-range="3M">3M</button>
          <button type="button" class="chart-page__range-btn" data-range="6M">6M</button>
          <button type="button" class="chart-page__range-btn" data-range="1Y">1Y</button>
          <button type="button" class="chart-page__range-btn" data-range="5Y">5Y</button>
          <button type="button" class="chart-page__range-btn" data-range="10Y" disabled title="Only 5 years of history available">10Y</button>
        </div>

        <div id="chart-status" class="chart-page__status">Loading chart…</div>
        <div id="chart-container" class="chart-page__container"></div>
      </div>

      <aside class="chart-page__news" aria-label="Company news">
        <h2 class="chart-page__news-heading">Company News</h2>
        <div id="news-feed-container" class="chart-page__news-feed">
          <p class="chart-page__news-placeholder">Loading news…</p>
        </div>
      </aside>
    </div>
  </main>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/chart-page.js"></script>
</body>

</html>
